<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SkyRoute - Google Photorealistic 3D Flight Experience</title>
    <link rel="icon" type="image/svg+xml" href="/skyroute-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/responsive-fixes.css" />
  </head>
  <body>
    <div id="app">
      <!-- 3D Map Viewport -->
      <div id="map-container"></div>

      <!-- Primary top bar -->
      <div id="top-app-bar">
        <div id="app-mode-switch" class="app-mode-switch" aria-label="SkyRoute mode">
          <button id="app-home" class="app-home-btn" type="button" title="最初の画面に戻る">
            <img src="/skyroute-icon.svg" alt="" class="app-mode-icon" />
            <span class="app-mode-brand">SkyRoute</span>
          </button>
          <button id="mode-route" class="app-mode-btn active" type="button"><strong>ROUTE</strong></button>
          <button id="mode-info" class="app-mode-btn" type="button"><strong>INFO</strong></button>
        </div>
      </div>

      <div id="info-root" hidden></div>

      <!-- Left Sidebar (Departures & Flight Info) -->
      <div id="left-panel-container">
        <div id="flight-panel-root"></div>
        <div id="flight-info-root"></div>
      </div>

      <!-- Top Right Floating Controls -->
      <div id="map-controls-container"></div>

      <!-- Bottom Playback Controller -->
      <div id="playback-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
